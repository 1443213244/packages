# mosdns 配置文件
# 日志级别设置
log:
  level: info

plugins:
  # ==================== 基础功能配置 ====================
  
  # 缓存配置：提高解析速度，减少DNS查询
  - tag: cache
    type: cache
    args:
      size: 40960          # 缓存大小
      lazy_cache_ttl: 86400  # 缓存时间24小时
      dump_file: "cache.dump"  # 缓存持久化
      dump_interval: 600    # 每10分钟保存一次


  # ==================== DNS服务器配置 ====================
  
  # 本地 DNS 服务器（用于解析内网域名）
  - tag: forward_local
    type: forward
    args:
      concurrent: 1
      upstreams:
        - addr: udp://127.0.0.1:53  # 使用本机DNS避免环路

  # 阿里DNS服务器（主要）- 仅用于国内域名
  - tag: forward_ali_primary
    type: forward
    args:
      concurrent: 2
      upstreams:
        - addr: tcp://223.5.5.5

  # 阿里DNS服务器（备用）
  - tag: forward_ali_backup
    type: forward
    args:
      concurrent: 2
      upstreams:
        - addr: tcp://223.6.6.6

  # Cloudflare DNS服务器（主要，加密）- 直连
  - tag: forward_cf_primary_direct
    type: forward
    args:
      concurrent: 2
      upstreams:
        - addr: https://1.1.1.1/dns-query
        - addr: tls://1.1.1.1:853

  # Cloudflare DNS服务器（主要，加密）- 代理
  - tag: forward_cf_primary_proxy
    type: forward
    args:
      concurrent: 2
      upstreams:
        - addr: https://1.1.1.1/dns-query
        - addr: tls://1.1.1.1:853

  # ==================== 匹配器配置 ====================

  # 本地域名匹配器
  - tag: local_matcher
    type: domain_set
    args:
      files:
        - "/etc/mosdns/rules/local.txt"

  # 国内域名匹配器
  - tag: china_matcher
    type: domain_set
    args:
      files:
        - "/etc/mosdns/rules/chinalist.txt"

  # GFW域名匹配器
  - tag: gfw_matcher
    type: domain_set
    args:
      files:
        - "/etc/mosdns/rules/gfwlist.txt"

  # ==================== 解析策略配置 ====================

  # 本地域名解析策略
  - tag: local_sequence
    type: sequence
    args:
      - matches: 
          - qname $local_matcher
        exec: $forward_local
      - matches: has_resp
        exec: accept

  # 国内域名解析策略：使用阿里DNS，带故障转移
  - tag: china_sequence
    type: sequence
    args:
      - exec: $forward_ali_primary
      - matches: has_resp
        exec: accept
      - exec: $forward_ali_backup
      - matches: has_resp
        exec: accept
      - exec: drop_resp

  # GFW域名解析策略：先尝试直连，失败则使用代理
  - tag: gfw_sequence
    type: sequence
    args:
      # 先尝试直连
      - exec: $forward_cf_primary_direct
      - matches: has_resp
        exec: ipset gfwlist,inet,32
      - matches: has_resp
        exec: accept
      # 直连失败则使用代理
      - exec: $forward_cf_primary_proxy
      - matches: has_resp
        exec: ipset gfwlist,inet,32
      - matches: has_resp
        exec: accept
      - exec: drop_resp

  # 主解析序列：定义DNS查询的处理流程
  - tag: main_sequence
    type: sequence
    args:
      # 1. 检查缓存
      - exec: $cache
      - matches: has_resp
        exec: accept

      # 2. 本地域名使用本地DNS
      - matches: qname $local_matcher
        exec: $local_sequence

      # 3. 国内域名使用阿里DNS（直连）
      - matches: qname $china_matcher
        exec: $china_sequence

      # 4. GFW域名使用智能DNS策略
      - matches: qname $gfw_matcher
        exec: $gfw_sequence

      # 5. 未匹配的域名使用智能DNS策略
      - exec: $gfw_sequence

  # ==================== 服务配置 ====================
  
  # UDP服务配置
  - tag: udp_server
    type: udp_server
    args:
      entry: main_sequence
      listen: :1853

  # TCP服务配置
  - tag: tcp_server
    type: tcp_server
    args:
      entry: main_sequence
      listen: :1853